name: CI

on:
  push:
  pull_request:

# Dependencies come from the system package managers wherever there is one (apt on Linux, brew on macOS), so CMake
# does not have to download Boost or build OpenBLAS. Windows has neither: CMake fetches them, and the build
# directories are cached between runs so that happens once per CMakeLists.txt change. ccache keeps compiled objects
# between runs on Linux and macOS (Boost.Graph headers are slow to compile).
#
# The code is C++23 (std::print, std::ranges::to, std::views::zip, ...): GCC 14, Clang 19 / Xcode 16.3 or
# MSVC 19.42. Ubuntu's default g++ is 13, so the Linux jobs select the g++-14 that ships on the runner image.

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost and OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev libopenblas-dev
      - name: Use GCC 14 (C++23)
        if: runner.os == 'Linux'
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Install Boost (LAPACK comes from Accelerate)
        if: runner.os == 'macOS'
        run: brew install boost
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.os }}
      - name: Use ccache
        if: runner.os != 'Windows'
        run: echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Cache the build directory (fetched Boost and OpenBLAS)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build
          key: cpp-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E regression  # regression has its own job

  # Every function and method/filter combination on data/data.csv against tests/regression/baseline: the C++
  # snapshot (catches regressions) and the original NetBone results (checks the port). See tests/regression/README.md.
  regression:
    name: Regression suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The C++ snapshot was generated on Linux. Elsewhere std::shuffle and std::uniform_real_distribution are
    # implemented differently (modularity_backbone, ecm) and macOS builds without OpenMP, so those runs only report.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost and OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev libopenblas-dev
      - name: Use GCC 14 (C++23)
        if: runner.os == 'Linux'
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Install Boost (LAPACK comes from Accelerate)
        if: runner.os == 'macOS'
        run: brew install boost
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: regression-${{ matrix.os }}
      - name: Use ccache
        if: runner.os != 'Windows'
        run: echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - name: Cache the build directory (fetched Boost and OpenBLAS)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build-regression
          key: regression-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Build and run the regression suite
        shell: bash
        run: tests/run_regression.sh

  python:
    name: Python module + cross-check against NetBone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost and OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-dev libopenblas-dev
      - name: Use GCC 14 (C++23)
        run: echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python
      - name: Use ccache
        run: echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt
      - name: Install NetBone (its own pins do not install on current Python; see benchmarks/README.md)
        run: |
          pip install -r benchmarks/requirements.txt
          pip install --no-deps netbone==0.2.3
      - name: Configure
        run: cmake -S . -B build-py -DCPPBONE_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build-py -j
      - name: Test (C++ and Python module)
        run: ctest --test-dir build-py --output-on-failure -E regression
      - name: Cross-check against the Python package
        run: PYTHONPATH=build-py python benchmarks/compare_python.py --check --reps 1
