name: Wheels

# Builds wheels for every CPython version cibuildwheel supports that matches requires-python (>=3.10),
# on Linux (glibc and musl), macOS and Windows, x86 and ARM. Each wheel is installed and tested by cibuildwheel.
# The version comes from project() in CMakeLists.txt. A push to main whose version has no v<version> tag yet
# creates that GitHub release (with the wheels) and uploads the wheels and the sdist to PyPI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -nE 's/^project\(.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # x86_64 and i686, manylinux + musllinux
          - os: ubuntu-24.04-arm   # aarch64, manylinux + musllinux
          - os: macos-latest       # arm64 and x86_64 (cross-compiled, tested under Rosetta)
            archs: arm64 x86_64
          - os: windows-latest     # AMD64 and x86
          - os: windows-11-arm     # ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=3,<4"
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Release v${{ needs.version.outputs.version }} and publish to PyPI
    if: github.event_name == 'push' && needs.version.outputs.released == 'false'
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the tag and the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_KEY }}  # PyPI API token
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.version.outputs.version }}" dist/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes
