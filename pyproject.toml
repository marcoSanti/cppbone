[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cppbone"
dynamic = ["version"]  # read from project() in CMakeLists.txt
description = "Fast C++ backbone extraction from simple weighted networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marco Edoardo Santimaria" }]
keywords = ["backbone", "network", "graph", "sparsification"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
interop = ["networkx", "pandas"]  # converting to and from networkx graphs / pandas DataFrames

[tool.scikit-build]
minimum-version = "0.11"
cmake.define.CPPBONE_PYTHON = "ON"
sdist.exclude = [".github", "benchmarks", "build*", "tests/regression/baseline"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = "project\\([^)]*VERSION\\s+(?P<value>\\d+\\.\\d+\\.\\d+)"

[tool.cibuildwheel]
build-verbosity = 1
test-command = "python {project}/tests/test_python.py {project}/data/data.csv"

# OpenBLAS (and on musllinux Boost) come from the container's package manager: dnf with PowerTools on
# manylinux_2_28, apk on musllinux; auditwheel then bundles OpenBLAS into the wheel. Whatever is missing or too old
# (Boost on manylinux_2_28 is 1.66; the manylinux2014 image used for i686 has neither) CMake fetches and builds, once
# per container: FETCHCONTENT_BASE_DIR is shared by the builds for the different Python versions.
[tool.cibuildwheel.linux]
before-all = """
if command -v dnf > /dev/null; then
  dnf install -y dnf-plugins-core && (dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb || true)
  dnf install -y openblas-devel || true
elif command -v apk > /dev/null; then
  apk add --no-cache boost-dev openblas-dev || true
fi
"""
environment = { SKBUILD_CMAKE_DEFINE = "FETCHCONTENT_BASE_DIR=/tmp/cppbone-deps" }

[tool.cibuildwheel.windows]
environment = { SKBUILD_CMAKE_DEFINE = "FETCHCONTENT_BASE_DIR=C:/cppbone-deps" }

[tool.cibuildwheel.macos]
before-all = "brew install boost"  # LAPACK comes from Accelerate
